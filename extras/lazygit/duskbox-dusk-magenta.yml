# duskbox-dusk-magenta — lazygit theme (generated by duskbox)
# Merge this gui.theme block into your lazygit config.yml
# (macOS: ~/Library/Application Support/lazygit/config.yml, else ~/.config/lazygit/config.yml).
gui:
  theme:
    activeBorderColor:
      - "#e990f6"
      - "bold"
    inactiveBorderColor:
      - "#7c869c"
    searchingActiveBorderColor:
      - "#dbb155"
      - "bold"
    optionsTextColor:
      - "#e990f6"
    selectedLineBgColor:
      - "#322b3f"
    cherryPickedCommitBgColor:
      - "#46304a"
    cherryPickedCommitFgColor:
      - "#e990f6"
    markedBaseCommitBgColor:
      - "#46304a"
    markedBaseCommitFgColor:
      - "#dbb155"
    unstagedChangesColor:
      - "#fb9795"
    defaultFgColor:
      - "#c6d1e9"
  authorColors:
    "*": "#b6aaff"
