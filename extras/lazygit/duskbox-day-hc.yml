# duskbox-day-hc — lazygit theme (generated by duskbox)
# Merge this gui.theme block into your lazygit config.yml
# (macOS: ~/Library/Application Support/lazygit/config.yml, else ~/.config/lazygit/config.yml).
gui:
  theme:
    activeBorderColor:
      - "#0c5092"
      - "bold"
    inactiveBorderColor:
      - "#2e3036"
    searchingActiveBorderColor:
      - "#6a5605"
      - "bold"
    optionsTextColor:
      - "#0c5092"
    selectedLineBgColor:
      - "#f2f2f2"
    cherryPickedCommitBgColor:
      - "#bce1e9"
    cherryPickedCommitFgColor:
      - "#812873"
    markedBaseCommitBgColor:
      - "#bce1e9"
    markedBaseCommitFgColor:
      - "#6a5605"
    unstagedChangesColor:
      - "#9e0213"
    defaultFgColor:
      - "#0b0d12"
  authorColors:
    "*": "#574084"
