# duskbox-dusk-salmon — lazygit theme (generated by duskbox)
# Merge this gui.theme block into your lazygit config.yml
# (macOS: ~/Library/Application Support/lazygit/config.yml, else ~/.config/lazygit/config.yml).
gui:
  theme:
    activeBorderColor:
      - "#fe9783"
      - "bold"
    inactiveBorderColor:
      - "#7c869c"
    searchingActiveBorderColor:
      - "#dbb155"
      - "bold"
    optionsTextColor:
      - "#fe9783"
    selectedLineBgColor:
      - "#3b2836"
    cherryPickedCommitBgColor:
      - "#522e27"
    cherryPickedCommitFgColor:
      - "#fe9783"
    markedBaseCommitBgColor:
      - "#522e27"
    markedBaseCommitFgColor:
      - "#dbb155"
    unstagedChangesColor:
      - "#fb9795"
    defaultFgColor:
      - "#c6d1e9"
  authorColors:
    "*": "#b6aaff"
