# duskbox-midnight — lazygit theme (generated by duskbox)
# Merge this gui.theme block into your lazygit config.yml
# (macOS: ~/Library/Application Support/lazygit/config.yml, else ~/.config/lazygit/config.yml).
gui:
  theme:
    activeBorderColor:
      - "#79b3f7"
      - "bold"
    inactiveBorderColor:
      - "#707a90"
    searchingActiveBorderColor:
      - "#e7c454"
      - "bold"
    optionsTextColor:
      - "#79b3f7"
    selectedLineBgColor:
      - "#13182c"
    cherryPickedCommitBgColor:
      - "#0c233f"
    cherryPickedCommitFgColor:
      - "#ee94db"
    markedBaseCommitBgColor:
      - "#0c233f"
    markedBaseCommitFgColor:
      - "#e7c454"
    unstagedChangesColor:
      - "#f4514c"
    defaultFgColor:
      - "#b9c4dc"
  authorColors:
    "*": "#b19ee3"
