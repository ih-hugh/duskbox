name: ci
on: { push: {}, pull_request: {} }

# CI runs on fork PRs. Keep the token read-only and reference NO secrets here, so a
# malicious PR has nothing to steal and can't write to the repo. (Uses `pull_request`,
# never `pull_request_target`, so fork code never runs with repo credentials.)
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: outputs are up to date
        run: git diff --exit-code -- colors lua/duskbox/themes themes extras package.json
      - run: node scripts/validate-vscode.mjs
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - name: neovim smoke (all variants)
        # Derive the variant list from the generated colors/ so it never drifts as variants are added.
        run: |
          for f in colors/duskbox-*.lua; do
            v=$(basename "$f" .lua); v=${v#duskbox-}
            nvim -u NONE --headless -c "lua vim.g.duskbox_test_variant='$v'" -c "luafile scripts/nvim-smoke.lua" -c "qa!"
          done
